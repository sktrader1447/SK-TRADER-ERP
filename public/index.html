<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Company ERP</title>
  <style>
    :root{
      --bg:#f4f6fb; --card:#fff; --ink:#1a2233; --mut:#6b7592; --line:#e3e8f2;
      --brand:#3b5bfd; --brand2:#2540d4; --ok:#17a673; --warn:#e8a13c; --bad:#e25563;
      --side:#131a2c; --sideink:#c7cfe4; --radius:14px; --shadow:0 6px 24px rgba(30,45,90,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);}
    a{color:var(--brand);text-decoration:none}
    .app{display:flex;min-height:100vh}
    /* Sidebar */
    .side{width:240px;background:var(--side);color:var(--sideink);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .22s ease}
    .side .brand{font-weight:800;font-size:18px;color:#fff;padding:20px 18px;display:flex;align-items:center;gap:10px}
    .side .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#7a5bff);display:grid;place-items:center;font-size:15px}
    .nav{flex:1;overflow-y:auto;padding:6px 10px 20px}
    .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin:2px 0;border:0;border-radius:9px;background:transparent;color:var(--sideink);font-size:14px;cursor:pointer;text-align:left;transition:.15s}
    .nav button:hover{background:rgba(255,255,255,.07);color:#fff}
    .nav button.active{background:linear-gradient(90deg,rgba(59,91,253,.35),rgba(59,91,253,.08));color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
    .nav .ic{width:20px;text-align:center;font-size:16px}
    .nav .group{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#6d7a9c;margin:16px 12px 6px}
    .side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8d98bb}
    /* Main */
    .main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-height:100vh}
    .topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30}
    .topbar h1{font-size:18px;margin:0;font-weight:700}
    .topbar .spacer{flex:1}
    .chip{padding:6px 12px;border-radius:999px;background:#eef1fb;color:var(--brand2);font-size:12px;font-weight:600}
    .content{padding:24px;max-width:1280px;width:100%;margin:0 auto}
    /* Cards */
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
    .stat .lbl{font-size:12px;color:var(--mut)}
    .stat .val{font-size:24px;font-weight:800;margin-top:6px}
    .stat .sub{font-size:12px;color:var(--mut);margin-top:4px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
    .panel .head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .panel .head .sp{flex:1}
    table{width:100%;border-collapse:collapse;font-size:13.5px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
    th{background:#f8faff;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
    .tbl-wrap{overflow-x:auto}
    /* forms */
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:12px;font-weight:600;color:var(--mut)}
    input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
    input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0}
    .btn{border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13.5px;background:var(--brand);color:#fff;transition:.15s}
    .btn:hover{background:var(--brand2)}
    .btn.ghost{background:#eef1fb;color:var(--brand2)}
    .btn.ghost:hover{background:#e2e7fb}
    .btn.danger{background:#fdecee;color:var(--bad)}
    .btn.ok{background:#e7f7f0;color:var(--ok)}
    .btn.warn{background:#fdf3e3;color:#b97a16}
    .btn.sm{padding:6px 10px;font-size:12.5px}
    .row-actions{display:flex;gap:6px;flex-wrap:wrap}
    /* badges */
    .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
    .pill.g{background:#e7f7f0;color:var(--ok)} .pill.y{background:#fdf3e3;color:#b97a16}
    .pill.r{background:#fdecee;color:var(--bad)} .pill.b{background:#eef1fb;color:var(--brand2)}
    .pill.p{background:#f3ecfd;color:#7a3be5} .pill.gry{background:#eef0f5;color:var(--mut)}
    /* toast */
    #toast{position:fixed;bottom:20px;right:20px;background:#131a2c;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;z-index:100;max-width:340px}
    #toast.show{opacity:1;transform:none}
    #toast.err{background:#b3263d}
    /* mobile */
    .hamb{display:none;background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--ink)}
    .scrim{display:none;position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:35}
    @media(max-width:860px){
      .side{transform:translateX(-100%)}
      .side.open{transform:none}
      .main{margin-left:0}
      .hamb{display:block}
      .scrim.show{display:block}
      .content{padding:16px}
    }
    .empty{padding:26px;text-align:center;color:var(--mut);font-size:14px}
    .muted{color:var(--mut);font-size:12.5px}
    /* modal popup */
    #modal{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:60;display:none;align-items:center;justify-content:center;overflow-y:auto;padding:40px 16px}
    #modal.show{display:flex}
    #modal .mbox{background:#fff;border-radius:var(--radius);width:100%;max-width:940px;box-shadow:0 18px 50px rgba(0,0,0,.35);max-height:calc(100vh - 80px);overflow-y:auto;margin:auto;display:flex;flex-direction:column}
    #modal .mhead{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#fff;z-index:5}
    #modal .mhead .sp{flex:1}
    #modal .mbody{padding:18px}
    .mclose{border:0;background:#eef1fb;color:var(--brand2);border-radius:9px;width:30px;height:30px;font-size:16px;font-weight:700;cursor:pointer;line-height:1}
    .mclose:hover{background:#e2e7fb}
    .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
    .kv:last-child{border-bottom:0}
    .hide-mobile{display:inline}
    @media(max-width:720px){ .hide-mobile{display:none} }
  </style>
</head>
<body>
  <div class="app">
    <div class="scrim" id="scrim" onclick="closeSide()"></div>
    <aside class="side" id="side">
      <div class="brand"><span class="logo">E</span> <span>ERP Suite</span></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="sidefoot"></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="hamb" onclick="toggleSide()">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="spacer"></div>
        <span class="chip" id="companyChip">All Companies</span>
        <span class="chip" id="userChip"></span>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="modal"><div class="mbox"><div class="mhead"><span id="modalTitle"></span><div class="sp"></div><button class="mclose" onclick="window.__closeModal()">✕</button></div><div class="mbody" id="modalBody"></div></div></div>
  <script type="module" src="./modules/app.js"></script>
</body>
</html>
