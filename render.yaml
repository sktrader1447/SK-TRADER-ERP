# Render Blueprint — deploy the ERP with a persistent disk.
# In the Render dashboard:
#   1. "New" -> "Blueprint" and point to your GitHub repo.
#   2. It reads this render.yaml automatically.
services:
  - type: web
    name: multi-company-erp
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    disk:
      name: erp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /data
